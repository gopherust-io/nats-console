services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.11-alpine
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
      - "--name=nats-consol-demo"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  console:
    build: .
    expose:
      - "8080"
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      NATS_URL: ${NATS_URL:?set NATS_URL in .env}
      NATS_MONITORING_URL: ${NATS_MONITORING_URL:-}
      HTTP_ADDR: ":8080"
      STATIC_DIR: /app/web
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ENV: ${ENV:-development}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      PPROF_ENABLED: ${PPROF_ENABLED:-true}
      PPROF_AUTH_ENABLED: ${PPROF_AUTH_ENABLED:-true}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      NATS_TLS_CA_FILE: ${NATS_TLS_CA_FILE:-}
      NATS_TLS_CERT_FILE: ${NATS_TLS_CERT_FILE:-}
      NATS_TLS_KEY_FILE: ${NATS_TLS_KEY_FILE:-}
      NATS_TLS_SERVER_NAME: ${NATS_TLS_SERVER_NAME:-}
      NATS_TLS_INSECURE_SKIP_VERIFY: ${NATS_TLS_INSECURE_SKIP_VERIFY:-false}
      NATS_CREDS_FILE: ${NATS_CREDS_FILE:-}
      NATS_TOKEN: ${NATS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  caddy:
    profiles: ["http3"]
    image: caddy:2.9-alpine
    ports:
      - "443:443/tcp"
      - "443:443/udp"
    environment:
      HTTP3_HOST: localhost
      HTTP3_UPSTREAM: console:8080
      HTTP3_TLS_MODE: internal
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - console

volumes:
  nats-data:
  postgres-data:
  caddy-data:
  caddy-config:
