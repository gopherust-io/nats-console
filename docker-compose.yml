name: nats-consol

include:
  - path: docker/nats/cluster/docker-compose.yml
  - path: examples/fleet/docker-compose.yml

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.11-alpine
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
      - "--name=nats-consol-demo"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  console:
    image: nats-consol:ci
    build: .
    expose:
      - "8080"
    ports:
      - "${CONSOLE_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      NATS_URL: ${NATS_URL:?set NATS_URL in .env}
      NATS_MONITORING_URL: ${NATS_MONITORING_URL:-}
      HTTP_ADDR: ":8080"
      STATIC_DIR: /app/web
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      SESSION_PRIVATE_KEY: ${SESSION_PRIVATE_KEY:?set SESSION_PRIVATE_KEY in .env}
      SESSION_PUBLIC_KEY: ${SESSION_PUBLIC_KEY:?set SESSION_PUBLIC_KEY in .env}
      ENV: ${ENV:-development}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      PPROF_ENABLED: ${PPROF_ENABLED:-true}
      PPROF_AUTH_ENABLED: ${PPROF_AUTH_ENABLED:-true}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      NATS_TLS_CA_FILE: ${NATS_TLS_CA_FILE:-}
      NATS_TLS_CERT_FILE: ${NATS_TLS_CERT_FILE:-}
      NATS_TLS_KEY_FILE: ${NATS_TLS_KEY_FILE:-}
      NATS_TLS_SERVER_NAME: ${NATS_TLS_SERVER_NAME:-}
      NATS_TLS_INSECURE_SKIP_VERIFY: ${NATS_TLS_INSECURE_SKIP_VERIFY:-false}
      NATS_CREDS_FILE: ${NATS_CREDS_FILE:-}
      NATS_TOKEN: ${NATS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  web-dev:
    profiles: ["web"]
    image: ${NODE_IMAGE:-node:22-alpine}
    working_dir: /web
    volumes:
      - ./web:/web
    ports:
      - "8080:8080"
    environment:
      VITE_API_PROXY_TARGET: http://console:8080
    command: ["sh", "-lc", "npm install && npm run dev -- --host 0.0.0.0"]
    depends_on:
      - console

  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  nats-data:
  postgres-data:
