# One container per fleet service → distinct NATS client names (fleet-<service>)
# visible in nats-consol Account → Connections.
#
# Included by the root nats-consol compose project (profile: fleet):
#   make nats-cluster-up && make fleet-up
#   # or: docker compose --profile fleet up -d --build
#
# Default NATS_URL lists all cluster peers so clients dial randomly across
# replicas and can reconnect when a node drops. Single broker override:
#   FLEET_NATS_URL=nats://nats:4222 make fleet-up
#
# Build context is the nats-consol module root (pulls gopherust-io/nats from the module proxy).

x-fleet: &fleet
  profiles: ["fleet"]
  image: nats-fleet:local
  build:
    context: ../..
    dockerfile: examples/fleet/Dockerfile
  restart: unless-stopped

x-fleet-env: &fleet-env
  NATS_URL: ${NATS_URL:-nats://nats-cluster-1:4222,nats://nats-cluster-2:4222,nats://nats-cluster-3:4222,nats://nats-cluster-4:4222,nats://nats-cluster-5:4222}
  STREAM_REPLICAS: ${STREAM_REPLICAS:-1}
  TEL_ENABLE: ${TEL_ENABLE:-false}

services:
  order-api:
    <<: *fleet
    container_name: fleet-order-api
    environment:
      <<: *fleet-env
      SERVICE: order-api
  order-fulfillment:
