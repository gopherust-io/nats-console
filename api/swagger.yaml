securityDefinitions:
  BasicAuth:
    type: basic
  BearerAuth:
    description: RS256 session JWT as `Bearer <token>` (same claims as the session
      cookie).
    in: header
    name: Authorization
    type: apiKey
  SessionCookie:
    description: HttpOnly RS256 session JWT cookie set by login.
    in: cookie
    name: nats_consol_session
    type: apiKey
swagger: "2.0"
