openapi: 3.1.0
info:
  title: NATS Consol API
  version: 0.8.0
  description: Self-hosted admin console for NATS JetStream — cluster-scoped REST, WebSocket, and SSE API.

servers:
  - url: /
    description: API root

security:
  - basicAuth: []
  - bearerAuth: []
  - sessionCookie: []

paths:
  /api/health:
    get:
      tags: [System]
      summary: Health and readiness check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/openapi.yaml:
    get:
      tags: [System]
      summary: OpenAPI specification
      security: []
      responses:
        "200":
          description: YAML spec

  /api/v1/auth/config:
    get:
      tags: [Auth]
      summary: Auth configuration
      security: []
      responses:
        "200":
          description: Auth config

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in; sets session, refresh, and CSRF cookies
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate access and refresh tokens
      description: Requires the refresh cookie and matching CSRF token. Validates the device fingerprint (User-Agent + client IP).
      security: []
      responses:
        "200":
          description: New session and refresh cookies issued
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        "204":
          description: Logged out

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        "200":
          description: User profile

  /api/v1/alerts:
    get:
      tags: [Alerts]
      summary: List alerts in the feed
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, closed] }
        - name: clusterId
          in: query
          schema: { type: string, format: uuid }
        - name: severity
          in: query
          schema: { type: string, enum: [info, warning, critical] }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"

  /api/v1/alerts/open-summary:
    get:
      tags: [Alerts]
      summary: Unacknowledged open alerts for the notification bell
      responses:
        "200":
          description: Open summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertOpenSummaryResponse"

  /api/v1/alerts/{alertId}:
    get:
      tags: [Alerts]
      summary: Get alert detail
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: Alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertResponse"

  /api/v1/alerts/{alertId}/acknowledge:
    post:
      tags: [Alerts]
      summary: Acknowledge an open alert (hides from badge)
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: Acknowledged alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertResponse"

  /api/v1/alert-rules:
    get:
      tags: [Alerts]
      summary: List alert rules
      responses:
        "200":
          description: Rules list
    post:
      tags: [Alerts]
      summary: Create alert rule
      responses:
        "201":
          description: Created rule

  /api/v1/alert-rules/metrics:
    get:
      tags: [Alerts]
      summary: Allowed metrics, comparators, and severities for the rule form
      responses:
        "200":
          description: Metric picker options

  /api/v1/alert-rules/{ruleId}:
    get:
      tags: [Alerts]
      summary: Get alert rule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: Rule
    patch:
      tags: [Alerts]
      summary: Update alert rule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: Updated rule
    delete:
      tags: [Alerts]
      summary: Delete alert rule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "204":
          description: Deleted

  /api/v1/audit:
    get:
      tags: [Audit]
      summary: List audit log entries (admin)
      parameters:
        - name: cluster_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit entries

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users (admin)
      responses:
        "200":
          description: User list

  /api/v1/users/{userId}/roles:
    put:
      tags: [Users]
      summary: Set user roles (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated user

  /api/v1/clusters:
    get:
      tags: [Clusters]
      summary: List clusters
      responses:
        "200":
          description: Cluster list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterListResponse"

  /api/v1/clusters/{clusterId}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Clusters]
      summary: Get cluster
      responses:
        "200":
          description: Cluster details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clusters/{clusterId}/test:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    post:
      tags: [Clusters]
      summary: Test cluster connectivity
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterTestResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clusters/{clusterId}/account:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [JetStream]
      summary: JetStream account info
      responses:
        "200":
          description: Account info
          content:
            application/json:
              schema:
                type: object
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/clusters/{clusterId}/event-catalog:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [EventCatalog]
      summary: List event catalog
      description: >
        Hybrid Swagger-style catalog of concrete NATS subjects discovered from
        JetStream stream subjects and consumer filters, merged with Postgres
        enrichments (owner, description, JSON Schema, example, deprecation).
        Consumers whose filters match each subject are included. Use `?fresh=1`
        to bypass the monitoring cache.
      parameters:
        - name: fresh
          in: query
          schema:
            type: string
            enum: ["1"]
          description: Bypass cached jsz snapshot when set to 1
      responses:
        "200":
          description: Event catalog snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCatalogSnapshot"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/clusters/{clusterId}/event-wikipedia:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [EventWikipedia]
      summary: List event Wikipedia pages
      description: >
        Auto-assembled per-subject documentation pages built from Event Catalog
        enrichments, live JetStream consumers, and Event Genome related peers.
        Use `?fresh=1` to bypass the monitoring cache and `?subject=` to filter
        a single page.
      parameters:
        - name: fresh
          in: query
          schema:
            type: string
            enum: ["1"]
          description: Bypass cached jsz snapshot when set to 1
        - name: subject
          in: query
          schema:
            type: string
          description: Optional concrete subject to return a single Wikipedia page
      responses:
        "200":
          description: Event Wikipedia snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventWikipediaSnapshot"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/clusters/{clusterId}/event-catalog/{subject}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - name: subject
        in: path
        required: true
        schema:
          type: string
        description: Concrete event subject (no NATS wildcards)
    put:
      tags: [EventCatalog]
      summary: Upsert event catalog enrichment
      description: Create or update owner, description, JSON Schema, example, and deprecation for a subject.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventCatalogUpsert"
      responses:
        "200":
          description: Saved enrichment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCatalogDoc"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [EventCatalog]
      summary: Delete event catalog enrichment
      description: Removes documentation only; live subjects still appear as undocumented.
      responses:
        "204":
          description: Enrichment removed
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clusters/{clusterId}/metrics/history:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Monitoring]
      summary: Historical cluster metrics
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: metrics
          in: query
          schema:
            type: string
          description: Comma-separated metric keys
        - name: step
          in: query
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 1d]
      responses:
        "200":
          description: Time-series metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters/{clusterId}/hidden-bottlenecks:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Monitoring]
      summary: Find hidden bottlenecks (schedule × payload correlations)
      description: >
        Deterministic mining of recurring weekday×hour patterns from hourly
        rollups (consumer lag, derived avg payload, optional fingerprint
        processing latency). Not the same as slow-consumer lag/CPU threshold
        alerts. Pass demo=1 for the canned Friday 18:00 showcase.
      parameters:
        - name: demo
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Bottleneck snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HiddenBottleneckSnapshot"

  /api/v1/clusters/{clusterId}/hidden-bottlenecks/ask:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    post:
      tags: [Monitoring]
      summary: Ask AI to narrate hidden bottleneck findings
      description: >
        Gemini narrates the same precomputed snapshot as GET (does not invent findings).
      parameters:
        - name: demo
          in: query
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        "200":
          description: AI reply plus snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                  snapshot:
                    $ref: "#/components/schemas/HiddenBottleneckSnapshot"

  /api/v1/chaos-story/demo:
    get:
      tags: [Docs]
      summary: Sample Black Friday chaos story
      description: >
        Canned multi-act disaster narrative for Docs showcase. Narrative only —
        does not inject faults into any cluster.
      responses:
        "200":
          description: Demo chaos story plus seed names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChaosStoryEnvelope"

  /api/v1/clusters/{clusterId}/chaos-story:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Docs]
      summary: Chaos story seed or demo
      description: >
        Without demo=1, returns capped live inventory names for the Chaos Story
        Generator. With demo=1, returns the canned Black Friday story.
      parameters:
        - name: demo
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: fresh
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Story and/or seed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChaosStoryEnvelope"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/clusters/{clusterId}/chaos-story/generate:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    post:
      tags: [Docs]
      summary: Generate a realistic chaos story with AI
      description: >
        Gemini invents a multi-act disaster narrative using only stream/consumer/subject
        names from live inventory. Does not inject faults. Requires AI_ENABLED.
      parameters:
        - name: fresh
          in: query
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hint:
                  type: string
                  description: Optional operator hint (e.g. Black Friday)
      responses:
        "200":
          description: Generated story plus seed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      story:
                        $ref: "#/components/schemas/ChaosStory"
                      seed:
                        $ref: "#/components/schemas/ChaosStorySeed"
        "404":
          description: AI assistant not enabled
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/clusters/{clusterId}/incident-annotations:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    post:
      tags: [Monitoring]
      summary: Create an incident annotation (e.g. deploy marker)
      description: >
        Records a CI/manual change event used by incident reconstruction.
        When deploy annotations exist in a window they take precedence over
        audit-log change fallbacks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentAnnotationCreate"
      responses:
        "201":
          description: Annotation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentAnnotation"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters/{clusterId}/monitoring/varz:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Monitoring]
      summary: NATS varz
      responses:
        "200":
          description: varz JSON
          content:
            application/json:
              schema:
                type: object

  /api/v1/clusters/{clusterId}/replicas:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Monitoring]
      summary: NATS server replicas (view-only)
      description: |
        Projects cluster server peers from varz, routez, and jsz meta_cluster.
        Rich varz stats apply only to the monitored node; other peers are route/meta-derived.
      parameters:
        - name: fresh
          in: query
          schema:
            type: string
            enum: ["1"]
          description: Bypass snapshot hub cache for varz/jsz
      responses:
        "200":
          description: Replica snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReplicasSnapshot"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/clusters/{clusterId}/replicas/events:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Monitoring]
      summary: Replicas SSE (demand-driven)
      description: |
        Server-Sent Events stream of projected replica snapshots while the Replicas
        page is open. Scrapes about every 2s while at least one subscriber is connected.
      responses:
        "200":
          description: text/event-stream with event name "replicas"
          content:
            text/event-stream:
              schema:
                type: string
        "503":
          description: replicas broker unavailable

  /api/v1/clusters/{clusterId}/monitoring/jsz:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Monitoring]
      summary: NATS jsz
      parameters:
        - name: acc
          in: query
          schema:
            type: string
        - name: streams
          in: query
          schema:
            type: boolean
        - name: consumers
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: jsz JSON
          content:
            application/json:
              schema:
                type: object

  /api/v1/clusters/{clusterId}/streams:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Streams]
      summary: List streams
      responses:
        "200":
          description: Stream list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamListResponse"
    post:
      tags: [Streams]
      summary: Create stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamConfig"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object

  /api/v1/clusters/{clusterId}/streams/{name}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
    get:
      tags: [Streams]
      summary: Get stream
      responses:
        "200":
          description: Stream info
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Streams]
      summary: Update stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
    delete:
      tags: [Streams]
      summary: Delete stream
      responses:
        "204":
          description: Deleted

  /api/v1/clusters/{clusterId}/streams/{name}/impact:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
    get:
      tags: [Streams]
      summary: Blast radius analysis for deleting a stream
      description: >
        Returns impacted service counts, related streams (mirror/source dependents
        and companion DLQ), consumer count, and critical service names derived from
        consumer metadata (nats-consol/service, nats-consol/critical).
      responses:
        "200":
          description: Blast radius summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlastRadius"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clusters/{clusterId}/streams/{name}/purge:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
    post:
      tags: [Streams]
      summary: Purge stream
      responses:
        "204":
          description: Purged

  /api/v1/clusters/{clusterId}/streams/{name}/consumers:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
    get:
      tags: [Consumers]
      summary: List consumers
      responses:
        "200":
          description: Consumer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerListResponse"
    post:
      tags: [Consumers]
      summary: Create consumer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerConfig"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object

  /api/v1/clusters/{clusterId}/streams/{name}/consumers/{consumer}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
      - $ref: "#/components/parameters/consumerName"
    get:
      tags: [Consumers]
      summary: Get consumer
      responses:
        "200":
          description: Consumer info
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Consumers]
      summary: Update consumer config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Consumers]
      summary: Delete consumer
      responses:
        "204":
          description: Deleted

  /api/v1/clusters/{clusterId}/streams/{name}/consumers/{consumer}/behavior-fingerprint:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
      - $ref: "#/components/parameters/consumerName"
    get:
      tags: [Consumers]
      summary: Get consumer behavior fingerprint
      description: >
        Returns the latest worker-reported Normal/Current msg/min and processing
        latency from the configured JetStream KV bucket (default
        nats_consol_fingerprints, key stream/durable). When no snapshot exists,
        available=false (HTTP 200) so the UI can show an idle state.
      responses:
        "200":
          description: Fingerprint snapshot (or available=false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BehaviorFingerprintReport"

  /api/v1/clusters/{clusterId}/streams/{name}/consumers/{consumer}/incident-reconstruction:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
      - $ref: "#/components/parameters/consumerName"
    get:
      tags: [Consumers]
      summary: Reconstruct an automatic incident timeline for a consumer
      description: >
        Merges deploy annotations (or audit-change fallback), consumer lag /
        redelivery / processing-stop detections, and named route disconnects
        into a chronological timeline. Defaults to the last 24 hours.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Reconstructed timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentReconstruction"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters/{clusterId}/streams/{name}/consumers/{consumer}/replay/dry-run:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
      - $ref: "#/components/parameters/consumerName"
    post:
      tags: [Consumers]
      summary: Preview replay impact without mutating the consumer
      description: >
        Estimates message count, duration, consumers affected, and potential
        duplicate services for a replay request. Does not reposition or create
        durables. Duration uses a fixed instant throughput heuristic (1000 msg/s)
        unless replayPolicy=original with a time window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayConsumerRequest"
      responses:
        "200":
          description: Dry-run estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayDryRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clusters/{clusterId}/streams/{name}/consumers/{consumer}/replay:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
      - $ref: "#/components/parameters/consumerName"
    post:
      tags: [Consumers]
      summary: Replay stream messages by seeking or side-caring a durable consumer
      description: >
        Repositions an existing durable (mode=reset) or creates a side-car durable
        (mode=sidecar) so messages are redelivered from a start sequence, time,
        beginning, or new messages only. Optional untilSeq, untilTime, and limit
        bound the intended window (stored in consumer metadata; JetStream does not
        enforce an end). Does not republish payloads onto subjects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayConsumerRequest"
      responses:
        "200":
          description: Replay applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayConsumerResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters/{clusterId}/streams/{name}/messages/range:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
      - name: startSeq
        in: query
        schema:
          type: integer
          format: int64
      - name: endSeq
        in: query
        schema:
          type: integer
          format: int64
      - name: startTime
        in: query
        schema:
          type: string
          format: date-time
      - name: endTime
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          default: 1000
          maximum: 1000
    get:
      tags: [Messages]
      summary: Fetch a closed range of stored messages by sequence or time
      description: >
        Returns stored messages without moving consumer cursors or republishing.
        Provide either startSeq+endSeq or startTime+endTime.
      responses:
        "200":
          description: Message range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRangeResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters/{clusterId}/streams/{name}/messages:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
    get:
      tags: [Messages]
      summary: Get message by sequence with optional navigation
      parameters:
        - name: seq
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: direction
          in: query
          schema:
            type: string
            enum: [next, prev]
      responses:
        "200":
          description: Raw stream message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawStreamMessage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Messages]
      summary: Publish a message to a stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishMessageRequest"
      responses:
        "201":
          description: Published message ack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishMessageResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters/{clusterId}/streams/{name}/dlq/messages:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
      - name: startSeq
        in: query
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
          maximum: 500
    get:
      tags: [Messages]
      summary: List dead-letter messages
      description: >
        Lists stored messages on a DLQ stream (`*_DLQ` or metadata role=dlq),
        parsing gopherust-io/nats DLQ headers into structured fields.
      responses:
        "200":
          description: DLQ message page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQListResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters/{clusterId}/streams/{name}/dlq/retry:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
    post:
      tags: [Messages]
      summary: Retry dead-letter messages
      description: >
        Republishes selected (or all, capped) DLQ messages to their original
        subjects, then deletes them from the DLQ stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DLQRetryRequest"
      responses:
        "200":
          description: Retry batch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLQRetryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/rotate-encryption-key:
    post:
      tags: [Administration]
      summary: Re-encrypt stored secrets with a new encryption key (root only)
      parameters:
        - name: dryRun
          in: query
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateEncryptionKeyRequest"
      responses:
        "200":
          description: Rotation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateEncryptionKeyResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/clusters/{clusterId}/live/ws:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Live]
      summary: Live message tail WebSocket
      description: |
        Upgrades to WebSocket. Query params: stream (required), subject (optional filter), from_seq (optional).
        Client may send JSON control frames: {"action":"pause"}, {"action":"resume"}, {"action":"clear"}.
      parameters:
        - name: stream
          in: query
          required: true
          schema:
            type: string
        - name: subject
          in: query
          schema:
            type: string
        - name: fromSeq
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "101":
          description: Switching Protocols
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters/{clusterId}/snapshots/events:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Live]
      summary: Snapshot refresh events (SSE)
      description: |
        Server-Sent Events stream. Emits `event: snapshot` with JSON data
        `{"clusterId":"...","capturedAt":"..."}` whenever the metrics snapshot hub
        publishes a fresh scrape for this cluster. Comment pings (`: ping`) are sent
        about every 15s to keep the connection alive. Auth uses the session cookie.
      responses:
        "200":
          description: text/event-stream of snapshot notifications
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: snapshot
                  data: {"clusterId":"abc","capturedAt":"2026-07-28T00:00:00Z"}
        "503":
          description: Snapshot hub unavailable

  /api/v1/clusters/{clusterId}/kv/buckets:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [KV]
      summary: List KV buckets
      responses:
        "200":
          description: Bucket list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVBucketListResponse"
    post:
      tags: [KV]
      summary: Create KV bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KVBucketConfig"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVBucketInfo"

  /api/v1/clusters/{clusterId}/kv/buckets/{bucket}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
    get:
      tags: [KV]
      summary: Get KV bucket info
      responses:
        "200":
          description: Bucket info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVBucketInfo"
    delete:
      tags: [KV]
      summary: Delete KV bucket
      responses:
        "204":
          description: Deleted

  /api/v1/clusters/{clusterId}/kv/buckets/{bucket}/keys:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
    get:
      tags: [KV]
      summary: List keys in KV bucket
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVKeyListResponse"

  /api/v1/clusters/{clusterId}/kv/buckets/{bucket}/keys/{key}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
      - $ref: "#/components/parameters/keyName"
    get:
      tags: [KV]
      summary: Get KV entry
      responses:
        "200":
          description: KV entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVEntry"
    put:
      tags: [KV]
      summary: Put KV entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KVPutRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVEntry"
    delete:
      tags: [KV]
      summary: Delete KV entry
      responses:
        "204":
          description: Deleted

  /api/v1/clusters/{clusterId}/kv/buckets/{bucket}/keys/{key}/history:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
      - $ref: "#/components/parameters/keyName"
    get:
      tags: [KV]
      summary: Get KV key history
      responses:
        "200":
          description: Key history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVHistoryResponse"

  /api/v1/clusters/{clusterId}/objects/buckets:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [ObjectStore]
      summary: List object store buckets
      responses:
        "200":
          description: Bucket list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectBucketListResponse"
    post:
      tags: [ObjectStore]
      summary: Create object store bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectBucketConfig"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectBucketInfo"

  /api/v1/clusters/{clusterId}/objects/buckets/{bucket}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
    get:
      tags: [ObjectStore]
      summary: Get object store bucket info
      responses:
        "200":
          description: Bucket info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectBucketInfo"
    put:
      tags: [ObjectStore]
      summary: Update object store bucket config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectBucketConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectBucketInfo"
    delete:
      tags: [ObjectStore]
      summary: Delete object store bucket
      responses:
        "204":
          description: Deleted

  /api/v1/clusters/{clusterId}/objects/buckets/{bucket}/objects:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
    get:
      tags: [ObjectStore]
      summary: List objects in bucket
      responses:
        "200":
          description: Object list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectListResponse"

  /api/v1/clusters/{clusterId}/objects/buckets/{bucket}/objects/{objectName}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
      - $ref: "#/components/parameters/objectName"
    get:
      tags: [ObjectStore]
      summary: Get object metadata and data
      responses:
        "200":
          description: Object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectInfo"
    put:
      tags: [ObjectStore]
      summary: Put object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectPutRequest"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectInfo"
    delete:
      tags: [ObjectStore]
      summary: Delete object
      responses:
        "204":
          description: Deleted

  /api/v1/clusters/{clusterId}/subject-permissions:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [NATSUsers]
      summary: List NATS users permitted on a subject
      description: |
        Returns which NATS users in an account can publish, subscribe, and queue-subscribe
        on the given subject. Queue subscribe uses the same JWT subscribe permission as subscribe.
      parameters:
        - name: account
          in: query
          schema:
            type: string
            default: Default
        - name: subject
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subject permissions lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectPermissionsResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters/{clusterId}/nats-users/subject-permissions:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [NATSUsers]
      deprecated: true
      summary: List NATS users permitted on a subject (legacy path)
      description: |
        Legacy alias for `/subject-permissions`. Prefer the cluster-scoped path to avoid
        colliding with `/nats-users/{userId}`.
      parameters:
        - name: account
          in: query
          schema:
            type: string
            default: Default
        - name: subject
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subject permissions lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectPermissionsResult"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 session JWT from POST /api/v1/auth/login (same claims as the session cookie).
    sessionCookie:
      type: apiKey
      in: cookie
      name: nats_consol_session
      description: HttpOnly RS256 session JWT cookie set by login.

  parameters:
    clusterId:
      name: clusterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    streamName:
      name: name
      in: path
      required: true
      schema:
        type: string
    consumerName:
      name: consumer
      in: path
      required: true
      schema:
        type: string
    bucketName:
      name: bucket
      in: path
      required: true
      schema:
        type: string
    keyName:
      name: key
      in: path
      required: true
      schema:
        type: string
    objectName:
      name: objectName
      in: path
      required: true
      schema:
        type: string
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream NATS error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        clusterId: { type: string, format: uuid }
        status: { type: string, enum: [open, closed] }
        severity: { type: string, enum: [info, warning, critical] }
        metric: { type: string }
        message: { type: string }
        firingValue: { type: number }
        threshold: { type: number }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time }
        ruleName: { type: string }

    Meta:
      type: object
      properties:
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }

    ErrorBody:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code:
          type: string
          description: Stable machine-readable error code
          enum:
            - not_found
            - forbidden
            - unauthorized
            - validation
            - conflict
            - timeout
            - unavailable
            - internal
            - rate_limit
            - csrf_invalid
            - gone
        retryable:
          type: boolean
          description: True when the client may safely retry the request (transient NATS/gateway failures and rate limits)
        retryAfterSeconds:
          type: integer
          description: Suggested wait before retry when retryable is true
      description: |
        Nested error object. retryable and retryAfterSeconds appear for transient
        failures (502/503/504 NATS errors and 429 rate limits).

    ErrorResponse:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    AlertListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Alert" }
        meta:
          $ref: "#/components/schemas/Meta"

    AlertOpenSummary:
      type: object
      properties:
        count: { type: integer }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/Alert" }

    AlertOpenSummaryResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AlertOpenSummary"

    AlertResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Alert"

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
        postgres:
          type: string
          example: ok
        natsDefaultCluster:
          type: string
          example: ok

    HealthResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/HealthStatus"

    SubjectPermissionEntry:
      type: object
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        signingGroup: { type: string }
        assignedUserId: { type: string, format: uuid }
        source: { type: string, enum: [user, signing-group, unrestricted] }
        matchedPattern: { type: string }

    SubjectPermissionsResult:
      type: object
      properties:
        subject: { type: string }
        publish:
          type: array
          items: { $ref: "#/components/schemas/SubjectPermissionEntry" }
        subscribe:
          type: array
          items: { $ref: "#/components/schemas/SubjectPermissionEntry" }
        queueSubscribe:
          type: array
          items: { $ref: "#/components/schemas/SubjectPermissionEntry" }

    Cluster:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        natsUrl:
          type: string
        monitoringUrl:
          type: string
        hasCreds:
          type: boolean
        hasToken:
          type: boolean
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ReplicaPeer:
      type: object
      required: [name, role, online]
      properties:
        name: { type: string }
        role: { type: string, enum: [monitored, route, meta] }
        online: { type: boolean }
        current: { type: boolean }
        leader: { type: boolean }
        uptime: { type: string }
        rtt: { type: string }
        idle: { type: string }
        version: { type: string }
        ip: { type: string }
        inMsgs: { type: integer, format: int64 }
        outMsgs: { type: integer, format: int64 }
        pending: { type: integer, format: int64 }
        connections: { type: integer }
        cpu: { type: number }
        mem: { type: integer, format: int64 }

    ReplicasSnapshot:
      type: object
      properties:
        capturedAt: { type: string, format: date-time }
        clusterName: { type: string }
        monitoredServer: { type: string }
        jetstreamLeader: { type: string }
        clusterSize: { type: integer }
        peerCount: { type: integer }
        onlineCount: { type: integer }
        peers:
          type: array
          items: { $ref: "#/components/schemas/ReplicaPeer" }

    ClusterResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Cluster"

    ClusterListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Cluster"
        meta:
          $ref: "#/components/schemas/Meta"

    ClusterTestResponse:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
        server_name:
          type: string
        jetstream:
          type: boolean

    StreamConfig:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        subjects:
          type: array
          items:
            type: string
        retention:
          type: string
        storage:
          type: string
        discard:
          type: string
          description: Discard policy (old or new)
        maxMsgs:
          type: integer
          format: int64
        maxBytes:
          type: integer
          format: int64
        maxAge:
          type: integer
          format: int64
          description: Nanoseconds
        maxConsumers:
          type: integer
        maxMsgSize:
          type: integer
          format: int32
        maxMsgsPerSubject:
          type: integer
          format: int64
        replicas:
          type: integer
        allowRollup:
          type: boolean
        denyDelete:
          type: boolean
        denyPurge:
          type: boolean
        discardNewPerSubject:
          type: boolean
        noAck:
          type: boolean
        sealed:
          type: boolean
        allowDirect:
          type: boolean
        mirrorDirect:
          type: boolean
        allowMsgTTL:
          type: boolean
        compression:
          type: string
          description: none or s2
        duplicates:
          type: integer
          format: int64
          description: Duplicate window in nanoseconds
        firstSeq:
          type: integer
          format: int64
        subjectDeleteMarkerTTL:
          type: integer
          format: int64
          description: Nanoseconds
        placement:
          type: object
          properties:
            cluster:
              type: string
            tags:
              type: array
              items:
                type: string
        mirror:
          $ref: "#/components/schemas/StreamSource"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/StreamSource"
        subjectTransform:
          type: object
          properties:
            src:
              type: string
            dest:
              type: string
        republish:
          type: object
          properties:
            src:
              type: string
            dest:
              type: string
            headersOnly:
              type: boolean
        consumerLimits:
          type: object
          properties:
            inactiveThreshold:
              type: integer
              format: int64
            maxAckPending:
              type: integer
        metadata:
          type: object
          additionalProperties:
            type: string

    StreamSource:
      type: object
      properties:
        name:
          type: string
        filterSubject:
          type: string
        optStartSeq:
          type: integer
          format: int64
        optStartTime:
          type: string
        external:
          type: object
          properties:
            api:
