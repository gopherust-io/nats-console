openapi: 3.1.0
info:
  title: NATS Consol API
  version: 0.8.0
  description: Self-hosted admin console for NATS JetStream — cluster-scoped REST and WebSocket API.

servers:
  - url: /
    description: API root

security:
  - basicAuth: []
  - sessionCookie: []

paths:
  /api/health:
    get:
      tags: [System]
      summary: Health and readiness check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/openapi.yaml:
    get:
      tags: [System]
      summary: OpenAPI specification
      security: []
      responses:
        "200":
          description: YAML spec

  /api/v1/auth/config:
    get:
      tags: [Auth]
      summary: Auth configuration
      security: []
      responses:
        "200":
          description: Auth config

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with username/password
      security: []
      responses:
        "200":
          description: Session created

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        "204":
          description: Logged out

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        "200":
          description: User profile

  /api/v1/alerts:
    get:
      tags: [Alerts]
      summary: List alerts in the feed
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, closed] }
        - name: clusterId
          in: query
          schema: { type: string, format: uuid }
        - name: severity
          in: query
          schema: { type: string, enum: [info, warning, critical] }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"

  /api/v1/alerts/open-summary:
    get:
      tags: [Alerts]
      summary: Unacknowledged open alerts for the notification bell
      responses:
        "200":
          description: Open summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertOpenSummary"

  /api/v1/alerts/{alertId}:
    get:
      tags: [Alerts]
      summary: Get alert detail
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: Alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /api/v1/alerts/{alertId}/acknowledge:
    post:
      tags: [Alerts]
      summary: Acknowledge an open alert (hides from badge)
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: Acknowledged alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /api/v1/alert-rules:
    get:
      tags: [Alerts]
      summary: List alert rules
      responses:
        "200":
          description: Rules list
    post:
      tags: [Alerts]
      summary: Create alert rule
      responses:
        "201":
          description: Created rule

  /api/v1/alert-rules/metrics:
    get:
      tags: [Alerts]
      summary: Allowed metrics, comparators, and severities for the rule form
      responses:
        "200":
          description: Metric picker options

  /api/v1/alert-rules/{ruleId}:
    get:
      tags: [Alerts]
      summary: Get alert rule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: Rule
    patch:
      tags: [Alerts]
      summary: Update alert rule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "200":
          description: Updated rule
    delete:
      tags: [Alerts]
      summary: Delete alert rule
      parameters:
        - $ref: "#/components/parameters/RuleId"
      responses:
        "204":
          description: Deleted

  /api/v1/audit:
    get:
      tags: [Audit]
      summary: List audit log entries (admin)
      parameters:
        - name: cluster_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit entries

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users (admin)
      responses:
        "200":
          description: User list

  /api/v1/users/{userId}/roles:
    put:
      tags: [Users]
      summary: Set user roles (admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated user

  /api/v1/clusters:
    get:
      tags: [Clusters]
      summary: List clusters
      responses:
        "200":
          description: Cluster list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterListResponse"

  /api/v1/clusters/{clusterId}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Clusters]
      summary: Get cluster
      responses:
        "200":
          description: Cluster details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clusters/{clusterId}/test:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    post:
      tags: [Clusters]
      summary: Test cluster connectivity
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterTestResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/clusters/{clusterId}/account:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [JetStream]
      summary: JetStream account info
      responses:
        "200":
          description: Account info
          content:
            application/json:
              schema:
                type: object
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v1/clusters/{clusterId}/metrics/history:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Monitoring]
      summary: Historical cluster metrics
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: metrics
          in: query
          schema:
            type: string
          description: Comma-separated metric keys
        - name: step
          in: query
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 1d]
      responses:
        "200":
          description: Time-series metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters/{clusterId}/monitoring/varz:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Monitoring]
      summary: NATS varz
      responses:
        "200":
          description: varz JSON
          content:
            application/json:
              schema:
                type: object

  /api/v1/clusters/{clusterId}/monitoring/jsz:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Monitoring]
      summary: NATS jsz
      parameters:
        - name: acc
          in: query
          schema:
            type: string
        - name: streams
          in: query
          schema:
            type: boolean
        - name: consumers
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: jsz JSON
          content:
            application/json:
              schema:
                type: object

  /api/v1/clusters/{clusterId}/streams:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Streams]
      summary: List streams
      responses:
        "200":
          description: Stream list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamListResponse"
    post:
      tags: [Streams]
      summary: Create stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamConfig"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object

  /api/v1/clusters/{clusterId}/streams/{name}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
    get:
      tags: [Streams]
      summary: Get stream
      responses:
        "200":
          description: Stream info
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Streams]
      summary: Update stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
    delete:
      tags: [Streams]
      summary: Delete stream
      responses:
        "204":
          description: Deleted

  /api/v1/clusters/{clusterId}/streams/{name}/purge:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
    post:
      tags: [Streams]
      summary: Purge stream
      responses:
        "204":
          description: Purged

  /api/v1/clusters/{clusterId}/streams/{name}/consumers:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
    get:
      tags: [Consumers]
      summary: List consumers
      responses:
        "200":
          description: Consumer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerListResponse"
    post:
      tags: [Consumers]
      summary: Create consumer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerConfig"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object

  /api/v1/clusters/{clusterId}/streams/{name}/consumers/{consumer}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
      - $ref: "#/components/parameters/consumerName"
    get:
      tags: [Consumers]
      summary: Get consumer
      responses:
        "200":
          description: Consumer info
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Consumers]
      summary: Update consumer config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Consumers]
      summary: Delete consumer
      responses:
        "204":
          description: Deleted

  /api/v1/clusters/{clusterId}/streams/{name}/consumers/{consumer}/replay:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
      - $ref: "#/components/parameters/consumerName"
    post:
      tags: [Consumers]
      summary: Replay stream messages by seeking or side-caring a durable consumer
      description: >
        Repositions an existing durable (mode=reset) or creates a side-car durable
        (mode=sidecar) so messages are redelivered from a start sequence, time,
        beginning, or new messages only. Does not republish payloads onto subjects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayConsumerRequest"
      responses:
        "200":
          description: Replay applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayConsumerResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters/{clusterId}/streams/{name}/messages:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/streamName"
    get:
      tags: [Messages]
      summary: Get message by sequence with optional navigation
      parameters:
        - name: seq
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: direction
          in: query
          schema:
            type: string
            enum: [next, prev]
      responses:
        "200":
          description: Raw stream message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RawStreamMessage"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Messages]
      summary: Publish a message to a stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishMessageRequest"
      responses:
        "201":
          description: Published message ack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishMessageResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/admin/rotate-encryption-key:
    post:
      tags: [Administration]
      summary: Re-encrypt stored secrets with a new encryption key (root only)
      parameters:
        - name: dryRun
          in: query
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateEncryptionKeyRequest"
      responses:
        "200":
          description: Rotation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateEncryptionKeyResult"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/clusters/{clusterId}/live/ws:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [Live]
      summary: Live message tail WebSocket
      description: |
        Upgrades to WebSocket. Query params: stream (required), subject (optional filter), from_seq (optional).
        Client may send JSON control frames: {"action":"pause"}, {"action":"resume"}, {"action":"clear"}.
      parameters:
        - name: stream
          in: query
          required: true
          schema:
            type: string
        - name: subject
          in: query
          schema:
            type: string
        - name: fromSeq
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "101":
          description: Switching Protocols
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/clusters/{clusterId}/kv/buckets:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [KV]
      summary: List KV buckets
      responses:
        "200":
          description: Bucket list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVBucketListResponse"
    post:
      tags: [KV]
      summary: Create KV bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KVBucketConfig"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVBucketInfo"

  /api/v1/clusters/{clusterId}/kv/buckets/{bucket}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
    get:
      tags: [KV]
      summary: Get KV bucket info
      responses:
        "200":
          description: Bucket info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVBucketInfo"
    delete:
      tags: [KV]
      summary: Delete KV bucket
      responses:
        "204":
          description: Deleted

  /api/v1/clusters/{clusterId}/kv/buckets/{bucket}/keys:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
    get:
      tags: [KV]
      summary: List keys in KV bucket
      responses:
        "200":
          description: Key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVKeyListResponse"

  /api/v1/clusters/{clusterId}/kv/buckets/{bucket}/keys/{key}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
      - $ref: "#/components/parameters/keyName"
    get:
      tags: [KV]
      summary: Get KV entry
      responses:
        "200":
          description: KV entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVEntry"
    put:
      tags: [KV]
      summary: Put KV entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KVPutRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVEntry"
    delete:
      tags: [KV]
      summary: Delete KV entry
      responses:
        "204":
          description: Deleted

  /api/v1/clusters/{clusterId}/kv/buckets/{bucket}/keys/{key}/history:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
      - $ref: "#/components/parameters/keyName"
    get:
      tags: [KV]
      summary: Get KV key history
      responses:
        "200":
          description: Key history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KVHistoryResponse"

  /api/v1/clusters/{clusterId}/objects/buckets:
    parameters:
      - $ref: "#/components/parameters/clusterId"
    get:
      tags: [ObjectStore]
      summary: List object store buckets
      responses:
        "200":
          description: Bucket list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectBucketListResponse"
    post:
      tags: [ObjectStore]
      summary: Create object store bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectBucketConfig"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectBucketInfo"

  /api/v1/clusters/{clusterId}/objects/buckets/{bucket}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
    get:
      tags: [ObjectStore]
      summary: Get object store bucket info
      responses:
        "200":
          description: Bucket info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectBucketInfo"
    put:
      tags: [ObjectStore]
      summary: Update object store bucket config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectBucketConfig"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectBucketInfo"
    delete:
      tags: [ObjectStore]
      summary: Delete object store bucket
      responses:
        "204":
          description: Deleted

  /api/v1/clusters/{clusterId}/objects/buckets/{bucket}/objects:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
    get:
      tags: [ObjectStore]
      summary: List objects in bucket
      responses:
        "200":
          description: Object list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectListResponse"

  /api/v1/clusters/{clusterId}/objects/buckets/{bucket}/objects/{objectName}:
    parameters:
      - $ref: "#/components/parameters/clusterId"
      - $ref: "#/components/parameters/bucketName"
      - $ref: "#/components/parameters/objectName"
    get:
      tags: [ObjectStore]
      summary: Get object metadata and data
      responses:
        "200":
          description: Object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectInfo"
    put:
      tags: [ObjectStore]
      summary: Put object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectPutRequest"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectInfo"
    delete:
      tags: [ObjectStore]
      summary: Delete object
      responses:
        "204":
          description: Deleted

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  parameters:
    clusterId:
      name: clusterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    streamName:
      name: name
      in: path
      required: true
      schema:
        type: string
    consumerName:
      name: consumer
      in: path
      required: true
      schema:
        type: string
    bucketName:
      name: bucket
      in: path
      required: true
      schema:
        type: string
    keyName:
      name: key
      in: path
      required: true
      schema:
        type: string
    objectName:
      name: objectName
      in: path
      required: true
      schema:
        type: string
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream NATS error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        clusterId: { type: string, format: uuid }
        status: { type: string, enum: [open, closed] }
        severity: { type: string, enum: [info, warning, critical] }
        metric: { type: string }
        message: { type: string }
        firingValue: { type: number }
        threshold: { type: number }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        acknowledgedAt: { type: string, format: date-time }
        ruleName: { type: string }

    AlertListResponse:
      type: object
      properties:
        alerts:
          type: array
          items: { $ref: "#/components/schemas/Alert" }
        total: { type: integer }

    AlertOpenSummary:
      type: object
      properties:
        count: { type: integer }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/Alert" }

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        postgres:
          type: string
          example: ok
        nats_default_cluster:
          type: string
          example: ok

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    Cluster:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        nats_url:
          type: string
        monitoring_url:
          type: string
        has_creds:
          type: boolean
        has_token:
          type: boolean
        is_default:
          type: boolean
        created_at:
