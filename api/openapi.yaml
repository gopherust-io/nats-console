          default: reset
        from:
          type: string
          enum: [seq, time, beginning, new]
        seq:
          type: integer
          format: int64
          description: Required when from=seq
        time:
          type: string
          format: date-time
          description: Required when from=time (RFC3339)
        untilSeq:
          type: integer
          format: int64
          description: Inclusive end sequence bound (metadata + result; JetStream has no server end)
        untilTime:
          type: string
          format: date-time
          description: Inclusive end timestamp (resolved to seq when possible)
        limit:
          type: integer
          description: Max messages in the intended replay window (use 1 for one message)
