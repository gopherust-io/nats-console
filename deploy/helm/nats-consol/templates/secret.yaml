apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nats-consol.fullname" . }}-secrets
  labels:
    {{- include "nats-consol.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required" .Values.secrets.encryptionKey | quote }}
  SESSION_PRIVATE_KEY: {{ required "secrets.sessionPrivateKey is required" .Values.secrets.sessionPrivateKey | quote }}
  SESSION_PUBLIC_KEY: {{ required "secrets.sessionPublicKey is required" .Values.secrets.sessionPublicKey | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
  {{- with .Values.config.natsToken }}
  NATS_TOKEN: {{ . | quote }}
  {{- end }}
