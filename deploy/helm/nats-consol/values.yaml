replicaCount: 1

image:
  repository: registry.gitlab.time2go.tech/gopherust-io/nats-consol
  tag: "0.8.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: nats-consol.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

env:
  ENV: production
  LOG_JSON: "true"
  LOG_LEVEL: warn
  METRICS_SNAPSHOT_INTERVAL: 120s
  TEL_COLLECTOR_GRPC_ADDR: "otel-collector:4317"

secrets:
  databaseUrl: ""
  encryptionKey: ""
  sessionPrivateKey: ""
  sessionPublicKey: ""
  adminPassword: ""

config:
  natsUrl: tls://nats:4222
  monitoringUrl: https://nats:8222
  adminUsername: admin
  defaultClusterName: default
  # Empty: omit (app default http://localhost:8080). Set to your public HTTPS URL in production.
  publicBaseUrl: ""
  corsAllowedOrigins: ""
  natsTlsCaFile: ""
  natsTlsCertFile: ""
  natsTlsKeyFile: ""
  natsTlsServerName: ""
  natsCredsFile: ""
  natsToken: ""

probes:
  liveness:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /api/health
    initialDelaySeconds: 5
    periodSeconds: 10
