name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Deny by default; each job declares least privilege below.
permissions: {}

env:
  GOWORK: off

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: ./...

      - name: Cache goalign
        id: goalign-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/goalign
          key: goalign-v1.4.0-${{ runner.os }}
      - name: Install goalign
        if: steps.goalign-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/go/bin"
          go install github.com/gopherust-io/goalign@v1.4.0
      - name: Run goalign
        run: |
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
          goalign analyze -r --arch=amd64 --fail-on-findings --min-waste=1 -e web/,bin/,node_modules/ .
      - name: Cache swag
        id: swag-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/swag
          key: swag-v1.16.4-${{ runner.os }}
      - name: Install swag
        if: steps.swag-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/go/bin"
          go install github.com/swaggo/swag/cmd/swag@v1.16.4
      - name: OpenAPI drift
        run: |
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
          make openapi
          git diff --exit-code -- api/swagger.yaml
      - name: Unit tests
        run: make test-unit
      - name: Build server
        run: go build -o /dev/null ./cmd

  web:
    name: Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Lint, typecheck, and build
        run: npm run lint && npm run typecheck && npm run build
      - name: Unit / UI tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true

  regression:
    name: Regression (${{ matrix.suite }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: true
      matrix:
        suite: [integration, contract, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: Run ${{ matrix.suite }} tests
        run: make test-${{ matrix.suite }}

  race-live:
    name: Race (live WebSocket)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: Race detector (live WebSocket)
        run: go test -race -count=1 -tags=integration ./internal/live/... ./tests/integration/... -run TestLiveWS

  smoke:
    name: Smoke (compose stack)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: Prepare compose env
        run: |
          cp .env.example .env
          sed -i 's|^PUBLIC_BASE_URL=.*|PUBLIC_BASE_URL=http://localhost:8080|' .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-admin-password/' .env
          sed -i 's/^PPROF_ENABLED=.*/PPROF_ENABLED=false/' .env
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: nats-consol:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack
        run: docker compose up -d
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 5
          done
          docker compose logs console
          exit 1
      - name: Smoke / acceptance
        run: make test-smoke
        env:
          BASE_URL: http://localhost:8080
          AUTH: admin:ci-admin-password

  performance:
    name: Performance baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: Cache vegeta
        id: vegeta-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/vegeta
          key: vegeta-v12.13.0-${{ runner.os }}
      - name: Install vegeta
        if: steps.vegeta-cache.outputs.cache-hit != 'true'
        run: go install github.com/tsenart/vegeta/v12@v12.13.0
      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Prepare compose env
        run: |
          cp .env.example .env
          sed -i 's|^PUBLIC_BASE_URL=.*|PUBLIC_BASE_URL=http://localhost:8080|' .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-admin-password/' .env
          sed -i 's/^PPROF_ENABLED=.*/PPROF_ENABLED=false/' .env
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: nats-consol:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack
        run: docker compose up -d
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 5
          done
          docker compose logs console
          exit 1
      - name: Performance baseline
        run: bash ./tests/performance/load.sh
        env:
          BASE_URL: http://localhost:8080
          AUTH: admin:ci-admin-password

  stress:
    name: Stress baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - name: Cache vegeta
        id: vegeta-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/vegeta
          key: vegeta-v12.13.0-${{ runner.os }}
      - name: Install vegeta
        if: steps.vegeta-cache.outputs.cache-hit != 'true'
        run: go install github.com/tsenart/vegeta/v12@v12.13.0
      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Prepare compose env
        run: |
          cp .env.example .env
          sed -i 's|^PUBLIC_BASE_URL=.*|PUBLIC_BASE_URL=http://localhost:8080|' .env
          sed -i 's/^ADMIN_PASSWORD=.*/ADMIN_PASSWORD=ci-admin-password/' .env
          sed -i 's/^PPROF_ENABLED=.*/PPROF_ENABLED=false/' .env
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: nats-consol:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack
        run: docker compose up -d
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/health && exit 0
            sleep 5
          done
          docker compose logs console
          exit 1
      - name: Stress baseline
        run: make test-stress
        env:
          BASE_URL: http://localhost:8080
          AUTH: admin:ci-admin-password

  ci-success:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [go, web, regression, race-live, smoke]
    if: always()
    permissions: {}
    steps:
      - name: Verify required jobs
        run: |
          check() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "Required job '$name' did not succeed (result: $result)"
              exit 1
            fi
          }

          check "Go" "${{ needs.go.result }}"
          check "Web" "${{ needs.web.result }}"
          check "Regression" "${{ needs.regression.result }}"
          check "Race (live WebSocket)" "${{ needs.race-live.result }}"
          check "Smoke (compose stack)" "${{ needs.smoke.result }}"

          echo "All required CI checks passed."
